[package]
name = "configgymajiggy"
version = "0.1.0"
authors = ["Daniel Brain <me@danielbrain.com>"]
edition = "2024"

[dependencies]
axum = "0.8.9"
dashmap = "6.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
rand = "0.10.2"
chrono = { version = "0.4.45", features = ["serde"] }
env_logger = "0.11.11"
log = "0.4.34"
dotenvy = "0.15.7"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "time"] }
tower-http = { version = "0.7.0", features = ["cors"] }

[dev-dependencies]
axum-test = "21.1"
