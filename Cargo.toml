[package]
name = "configgymajiggy"
version = "0.1.0"
authors = ["Daniel Brain <me@danielbrain.com>"]
edition = "2024"
rust-version = "1.85"
description = "PIN-based temporary data exchange over HTTP"
license = "MIT"
publish = false

[dependencies]
axum = "0.8.9"
dashmap = "6.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rand = "0.10.2"
env_logger = "0.11.11"
log = "0.4.34"
dotenvy = "0.15.7"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "time", "signal", "io-util"] }
tower-http = { version = "0.7.0", features = ["cors", "timeout"] }

[dev-dependencies]
axum-test = "21.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
