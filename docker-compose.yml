services:
  configgymajiggy:
    build: .
    container_name: configgymajiggy-service
    # Override in .env to expose on a different host port. Note this publishes
    # on every host interface, not just loopback.
    ports:
      - "${EXTERNAL_PORT:-8080}:8080"
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - PIN_LENGTH=${PIN_LENGTH:-4}
      - STALE_AGE_MINS=${STALE_AGE_MINS:-10}
      - MAX_PAYLOAD_BYTES=${MAX_PAYLOAD_BYTES:-3000}
      - MAX_ENTRIES=${MAX_ENTRIES:-100000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
    restart: unless-stopped
    # Healthcheck comes from the Dockerfile.
    # State is in-memory and unbounded by design; these cap the blast radius of
    # a traffic spike to this container rather than the host.
    mem_limit: 512m
    pids_limit: 128
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    networks:
      - configgymajiggy-network

networks:
  configgymajiggy-network:
    driver: bridge
