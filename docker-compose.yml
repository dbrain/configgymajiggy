services:
  configgymajiggy:
    build: .
    container_name: configgymajiggy-service
    # Override in .env to expose on a different host port.
    ports:
      - "${EXTERNAL_PORT:-8080}:8080"
    environment:
      - RUST_LOG=${RUST_LOG:-info}
    restart: unless-stopped
    # Healthcheck comes from the Dockerfile.
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      - configgymajiggy-network

networks:
  configgymajiggy-network:
    driver: bridge
