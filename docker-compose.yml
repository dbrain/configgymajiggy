services:
  configgymajiggy:
    build: .
    container_name: configgymajiggy-service
    # PUBLISH_ADDRESS controls which host interface the port binds to. It
    # defaults to all of them; set it to 127.0.0.1 to reach the service only
    # from this host (e.g. via a reverse proxy that terminates TLS).
    ports:
      - "${PUBLISH_ADDRESS:-0.0.0.0}:${EXTERNAL_PORT:-8080}:8080"
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - PIN_LENGTH=${PIN_LENGTH:-4}
      - STALE_AGE_MINS=${STALE_AGE_MINS:-10}
      - MAX_PAYLOAD_BYTES=${MAX_PAYLOAD_BYTES:-3000}
      - MAX_ENTRIES=${MAX_ENTRIES:-100000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - MAX_PINS_PER_NAMESPACE=${MAX_PINS_PER_NAMESPACE:-1000}
      - MAX_PROBE_MISSES=${MAX_PROBE_MISSES:-60}
      - PROBE_WINDOW_SECS=${PROBE_WINDOW_SECS:-60}
      - MAX_LONG_POLL_SECS=${MAX_LONG_POLL_SECS:-30}
    restart: unless-stopped
    # Healthcheck comes from the Dockerfile.
    # State is in-memory and unbounded by design; these cap the blast radius of
    # a traffic spike to this container rather than the host.
    mem_limit: 512m
    pids_limit: 128
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    networks:
      - configgymajiggy-network

networks:
  configgymajiggy-network:
    driver: bridge
